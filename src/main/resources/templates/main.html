<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movie Booking</title>
    <link rel="stylesheet" href="/css/common/reset.css">
    <link rel="stylesheet" href="/css/common/header.css">
    <link rel="stylesheet" href="/css/common/footer.css">
    <link rel="stylesheet" href="/css/main/main.css">
</head>
<body>

<!-- HEADER -->
<div th:replace="fragments/header :: header"></div>

<!-- ================= HERO ================= -->
<section class="hero">
    <div class="hero-content">
        <h1 class="movie-title">대표 영화 제목</h1>
        <p class="movie-sub">여기에 영화 한 줄 설명</p>

        <div class="hero-buttons">
            <a href="#" class="btn primary">예매하기</a>
            <a href="#" class="btn">상세보기</a>
        </div>
    </div>

    <div class="hero-image">
        <img src="/images/sample-poster.jpg" alt="영화 포스터">
    </div>
</section>

<!-- ================= BOX OFFICE ================= -->
<section class="boxoffice">
    <div class="section-header">
        <h2>박스오피스</h2>
        <a href="#">더 많은 영화보기 &gt;</a>
    </div>

    <div class="movie-grid">
        <div class="movie-card">
            <span class="rank">1</span>
            <img src="/images/sample-poster.jpg">
            <div class="movie-info">
                <p>영화 제목</p>
                <a href="#" class="reserve-btn">예매</a>
            </div>
        </div>
        <!-- 카드 2~4 동일 -->
    </div>
</section>

<!-- FOOTER -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
