<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(
        '환불 이력 관리',
        'refunds',
        ~{::pageCss},
        ~{::content}
      )}">

<!-- ================= pageCss ================= -->
<th:block th:fragment="pageCss">
    <!-- 필요 시 환불 전용 CSS -->
    <!-- <link rel="stylesheet" th:href="@{/css/admin/refund.css}"> -->
</th:block>

<!-- ================= content ================= -->
<th:block th:fragment="content">

    <section class="admin-content">

        <h1 class="admin-title">환불 이력</h1>

        <!-- 검색 영역 -->
        <form class="admin-filter" method="get" th:action="@{/admin/refunds/history}">
            <div class="filter-row">
                <label for="from">시작일</label>
                <input type="date" id="from" name="from" th:value="${from}"/>

                <label for="to">종료일</label>
                <input type="date" id="to" name="to" th:value="${to}"/>

                <input type="text"
                       name="keyword"
                       placeholder="회원 이메일 / 예매코드"
                       th:value="${keyword}"/>

                <button type="submit" class="btn btn-primary">조회</button>
            </div>
        </form>

        <!-- 테이블 -->
        <div class="table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>환불 ID</th>
                    <th>결제 ID</th>
                    <th>예매코드</th>
                    <th>회원 이메일</th>
                    <th>정책명</th>
                    <th>환불률</th>
                    <th>환불 금액</th>
                    <th>환불 일시</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${page == null or #lists.isEmpty(page.content)}">
                    <td colspan="8" class="empty-row">조회 결과가 없습니다.</td>
                </tr>

                <tr th:each="row : ${page.content}">
                    <td th:text="${row.refund.refundId}">1</td>
                    <td th:text="${row.payment.paymentId}">10</td>
                    <td th:text="${row.payment.reservationCode}">R0001</td>
                    <td th:text="${row.member.email}">user@test.com</td>
                    <td th:text="${row.refund.policyName}">정책명</td>
                    <td th:text="${row.refund.refundRate + '%'}">100%</td>
                    <td th:text="${row.refund.refundAmount + '원'}">8000원</td>
                    <td th:text="${#temporals.format(row.refund.refundedAt, 'yyyy-MM-dd HH:mm')}">
                        2026-02-05 12:00
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- 페이징 -->
        <div class="pagination" th:if="${page != null and page.totalPages > 1}">
            <a th:if="${page.hasPrevious()}"
               th:href="@{/admin/refunds/history(
                    page=${page.number - 1},
                    size=${page.size},
                    from=${from},
                    to=${to},
                    keyword=${keyword}
               )}">
                이전
            </a>

            <span th:text="${page.number + 1}"></span>
            /
            <span th:text="${page.totalPages}"></span>

            <a th:if="${page.hasNext()}"
               th:href="@{/admin/refunds/history(
                    page=${page.number + 1},
                    size=${page.size},
                    from=${from},
                    to=${to},
                    keyword=${keyword}
               )}">
                다음
            </a>
        </div>

    </section>

</th:block>
</html>
