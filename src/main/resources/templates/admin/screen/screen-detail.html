<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/admin-layout :: layout(
        '상영관 상세', 'screens', ~{::pageCss}, ~{::content}
      )}">

<th:block th:fragment="pageCss">
  <link rel="stylesheet" th:href="@{/css/admin/screen/screen-detail.css}">
</th:block>

<th:block th:fragment="content">

  <!-- 상단 헤더 -->
  <div class="page-head">
    <a class="back-link" th:href="@{/admin/screens}">‹</a>

    <div class="head-title-wrap">
      <h1 class="page-title" th:text="${screen.name}">1관</h1>

      <span class="badge"
            th:classappend="${screen.operating} ? ' badge-on' : ' badge-off'"
            th:text="${screen.operating} ? '운영중' : '미운영'">
        운영중
      </span>
    </div>

    <a class="btn primary head-action"
       th:href="@{/admin/screens/{screenId}/edit(screenId=${screenId})}">
      ✎ 상영관 수정
    </a>
  </div>

  <!-- 상영 타입 칩 -->
  <div class="chip-row">
    <span class="chip"
          th:text="${screen.screeningType != null ? screen.screeningType.displayName : '상영 타입'}">
      2D
    </span>
  </div>

  <!-- 요약 카드 -->
  <section class="summary-grid">
    <div class="summary-card">
      <div class="summary-label">전체 좌석</div>
      <div class="summary-value" th:text="${screen.totalSeats} + '석'">120석</div>
    </div>

    <div class="summary-card summary-card-blue">
      <div class="summary-label">사용 가능</div>
      <div class="summary-value" th:text="${availableSeats} + '석'">120석</div>
    </div>
  </section>

  <!-- 좌석 관리 툴바 -->
  <section class="seat-card">
    <div class="seat-toolbar">
      <div class="toolbar-left">
        <button class="btn outline" type="button">＋ 좌석 추가</button>
        <button class="btn outline" type="button">✎ 좌석 수정</button>
        <button class="btn outline danger" type="button">🗑 좌석 삭제</button>
      </div>

      <div class="toolbar-right">
        <div class="seat-count">
          좌석 수
          <strong class="count-strong" th:text="${availableSeats}">120</strong>
          /
          <span th:text="${screen.totalSeats}">120</span>
        </div>
      </div>
    </div>

    <div class="seat-notice">
      <div class="notice-title">좌석 관리 제약 안내</div>
      <ul class="notice-list">
        <li>좌석 추가/삭제/배치 변경은 <strong>상영관 미운영 상태</strong>에서만 가능합니다.</li>
        <li>좌석 사용 가능 여부는 <strong>운영 중</strong>에도 변경할 수 있습니다.</li>
      </ul>
    </div>
  </section>

  <!-- 좌석 배치 (screen-create 방식으로 JS 렌더링) -->
  <section class="seat-map-card">

    <div class="screen-bar"></div>
    <div class="screen-text">SCREEN</div>

    <!-- ✅ create처럼 비워두고 JS가 row-label + seat 버튼을 생성 -->
    <div class="seat-wrap" id="seatWrapDetail"></div>

    <!-- ✅ 서버 seats를 JS로 전달 (rowNo/colNo/seatCode/active) -->
    <script th:inline="javascript">
      window.__SEATS__ = /*[[${screen.seats}]]*/ [];
    </script>

    <!-- 범례(create와 동일) -->
    <div class="seat-legend">
      <div class="legend-item">
        <span class="legend-box on"></span>
        <span>사용 가능</span>
      </div>
      <div class="legend-item">
        <span class="legend-box off"></span>
        <span>사용 불가</span>
      </div>
    </div>
  </section>

  <script>
    (function () {
      const wrap = document.getElementById('seatWrapDetail');
      if (!wrap) return;

      const seats = (window.__SEATS__ || []).slice();

      // ✅ seats에서 rows/cols 계산 (model seatRows/seatCols 제거)
      const rows = seats.length ? Math.max(...seats.map(s => Number(s.rowNo || 0))) : 1;
      const cols = seats.length ? Math.max(...seats.map(s => Number(s.colNo || 0))) : 1;

      // grid 크기 적용 (seat-wrap CSS가 var(--rows/--cols) 사용)
      wrap.style.setProperty('--rows', String(rows));
      wrap.style.setProperty('--cols', String(cols));

      function toRowLetter(rowNo) {
        // 1->A, 2->B ...
        return String.fromCharCode('A'.charCodeAt(0) + (rowNo - 1));
      }

      function clear(el) {
        while (el.firstChild) el.removeChild(el.firstChild);
      }

      // key: "r-c"
      const seatMap = new Map();
      seats.forEach(s => {
        const r = Number(s.rowNo);
        const c = Number(s.colNo);
        seatMap.set(`${r}-${c}`, {
          rowNo: r,
          colNo: c,
          seatCode: s.seatCode,
          active: !!s.active
        });
      });

      function render() {
        clear(wrap);

        for (let r = 1; r <= rows; r++) {
          // row label
          const label = document.createElement('div');
          label.className = 'row-label';
          label.style.gridRow = String(r);
          label.style.gridColumn = '1';
          label.textContent = toRowLetter(r);
          wrap.appendChild(label);

          for (let c = 1; c <= cols; c++) {
            const key = `${r}-${c}`;
            const seat = seatMap.get(key);

            // ✅ 빈칸 좌석도 그리드 칸 유지하려면 "off" 더미로 표시
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'seat ' + (seat && seat.active ? 'on' : 'off');
            btn.dataset.key = key;

            btn.style.gridRow = String(r);
            btn.style.gridColumn = String(c + 1); // 1은 행 라벨

            if (seat && seat.active) {
              btn.textContent = seat.seatCode;
              btn.title = seat.seatCode;
            } else if (seat) {
              btn.textContent = 'X';
              btn.title = seat.seatCode + ' (사용 불가)';
            } else {
              // 데이터에 없는 칸(구멍)
              btn.textContent = '';
              btn.title = '좌석 없음';
              btn.disabled = true;
              btn.classList.add('off');
            }

            wrap.appendChild(btn);
          }
        }
      }

      render();

      // ✅ create 느낌: off는 클릭 무시, on만 선택 토글
      wrap.addEventListener('click', (e) => {
        const btn = e.target.closest('.seat');
        if (!btn) return;
        if (!wrap.contains(btn)) return;
        if (btn.classList.contains('off')) return;

        btn.classList.toggle('seat-selected');
      });
    })();
  </script>

</th:block>
</html>
