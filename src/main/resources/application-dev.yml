spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  session:
    store-type: redis

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 3s

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}

file:
  storage:
    type: s3
    s3-bucket: ${S3_BUCKET_NAME}
    s3-region: ${AWS_REGION:ap-northeast-2}
    image-base-url: ${CDN_BASE_URL}

# ADOT Collector 사이드카(같은 Task, awsvpc 네트워크 공유)로 전송 → Collector가 X-Ray/CloudWatch로 export
management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        enabled: true
        url: http://localhost:4318/v1/metrics
