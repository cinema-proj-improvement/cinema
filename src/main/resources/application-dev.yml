spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  session:
    store-type: redis

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 3s

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}

file:
  storage:
    type: s3
    s3-bucket: ${S3_BUCKET_NAME}
    s3-region: ${AWS_REGION:ap-northeast-2}
    image-base-url: ${CDN_BASE_URL}
