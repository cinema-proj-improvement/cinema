spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop # 운영환경은 validate
    show_sql: true

file:
  upload:
    base-path: /home/gitlab-runner/uploads

logging:
  level:
    root: INFO
    com.example.elicesecondproject: DEBUG
