server:
  port: 8080

  servlet:
    session:
      timeout: 24h

spring:
  datasource:
    url: jdbc:h2:mem:cinema;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

  session:
    store-type: none  # redis 연결 시도 X

  data:
    redis:
      host: localhost
      port: 6379
      password:

file:
  storage:
    type: local
    image-base-url: /uploads
  upload:
    base-path: ${FILE_UPLOAD_BASE_PATH:/tmp/cinema/uploads} # [Windows 예시: C:/cinema/uploads] [macOS/Linux 예시: /tmp/cinema/uploads]

toss:
  payments:
    client-key: toss-dummy-client-key
    secret-key: toss-dummy-secret-key  # TossPaymentsClient가 @Value("${toss.payments.secret-key}") 없이는 빈 생성에서 바로 터지기 때문에 방지